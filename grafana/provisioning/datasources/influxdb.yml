apiVersion: 1
datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: ${INFLUXDB_ORG}
      defaultBucket: sensor-data-raw
    secureJsonData:
      token: ${INFLUXDB_TOKEN}
    database: iot_data
    user: admin
    password: admin123