listener 1883
allow_anonymous false
password_file /mosquitto/data/password_file

# -- Bridge Configuration con HiveMQ (broker público) ---------------------------------------------
connection hivemq
address broker.hivemq.com:8883

bridge_cafile /etc/ssl/certs/ca-certificates.crt

bridge_protocol_version mqttv311
bridge_insecure false

try_private false

#topic # both 2
# Así se comparte solo los topicos del proyecto enviro, y no todos los topicos del broker remoto
topic enviro/# both 1

# -- Persistence and logs ---------------------------------------------
persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log